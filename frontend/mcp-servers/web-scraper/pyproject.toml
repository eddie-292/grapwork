[project]
name = "web-scraper-mcp-server"
version = "1.0.0"
description = "MCP server for web scraping - fetch webpage content, extract text, links, images, and metadata"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
web_scraper = "web_scraper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = ["web_scraper.py", "pyproject.toml", "README.md", "requirements.txt"]
