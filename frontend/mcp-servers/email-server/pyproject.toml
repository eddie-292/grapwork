[project]
name = "email-mcp-server"
version = "0.1.0"
description = "MCP server for sending and receiving emails"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
email_server = "email_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
