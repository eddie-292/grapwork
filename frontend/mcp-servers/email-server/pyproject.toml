[project]
name = "email-mcp-server"
version = "0.1.0"
description = "MCP server for sending and receiving emails"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
email_server = "email_server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = ["email_server.py", "pyproject.toml", "README.md", "requirements.txt"]
