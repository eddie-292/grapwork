<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 圆角背景 - 浅色渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8ecf8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grape1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grape2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grape3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bgGradient)"/>
  <!-- 边框 -->
  <rect width="512" height="512" rx="108" fill="none" stroke="#d4d4e4" stroke-width="4"/>

  <!-- 三颗葡萄 - 三角形排列 -->
  <!-- 顶部葡萄 -->
  <circle cx="256" cy="195" r="60" fill="url(#grape1)"/>
  <!-- 左下葡萄 -->
  <circle cx="195" cy="305" r="60" fill="url(#grape2)"/>
  <!-- 右下葡萄 -->
  <circle cx="317" cy="305" r="60" fill="url(#grape3)"/>

  <!-- 葡萄高光点 -->
  <circle cx="236" cy="172" r="12" fill="#fff" opacity="0.5"/>
  <circle cx="175" cy="282" r="12" fill="#fff" opacity="0.5"/>
  <circle cx="297" cy="282" r="12" fill="#fff" opacity="0.5"/>
</svg>
