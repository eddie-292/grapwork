<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="108" fill="#1a1a2e"/>

  <!-- 三颗葡萄 - 三角形排列 -->
  <!-- 顶部葡萄 -->
  <circle cx="256" cy="200" r="56" fill="#555"/>
  <!-- 左下葡萄 -->
  <circle cx="200" cy="300" r="56" fill="#444"/>
  <!-- 右下葡萄 -->
  <circle cx="312" cy="300" r="56" fill="#333"/>

  <!-- 葡萄高光点 -->
  <circle cx="240" cy="180" r="10" fill="#fff" opacity="0.3"/>
  <circle cx="184" cy="280" r="10" fill="#fff" opacity="0.3"/>
  <circle cx="296" cy="280" r="10" fill="#fff" opacity="0.3"/>
</svg>
